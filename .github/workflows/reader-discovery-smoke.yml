name: SOTW reader Topics, BSB and Jacob source QA

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "mobile-bible-beta/index.html"
      - "mobile-bible-beta/universal-search.js"
      - "mobile-bible-beta/approved-names-search.js"
      - "mobile-bible-beta/tests/approved-names.test.cjs"
      - "mobile-bible-beta/tests/approved-names-browser.test.cjs"
      - "mobile-bible-beta/universal-search.css"
      - "mobile-bible-beta/desktop-workspace.css"
      - "mobile-bible-beta/tests/desktop-workspace-browser.test.cjs"
      - "mobile-bible-beta/data/universal-search/**"
      - "mobile-bible-beta/scripts/build-universal-search.mjs"
      - "mobile-bible-beta/tests/universal-search.test.cjs"
      - "mobile-bible-beta/discovery-integrations.js"
      - "mobile-bible-beta/study-ux-repair.js"
      - "mobile-bible-beta/jacob-scripture-links.js"
      - "mobile-bible-beta/reader-return.js"
      - "mobile-bible-beta/reader-trail.js"
      - "mobile-bible-beta/tests/reader-trail.test.cjs"
      - "mobile-bible-beta/tests/reader-trail-browser.test.cjs"
      - "mobile-bible-beta/jacob-search.js"
      - "mobile-bible-beta/tests/jacob-search.test.cjs"
      - "mobile-bible-beta/tests/jacob-search-browser.test.cjs"
      - "mobile-bible-beta/tests/jacob-doctrine.test.cjs"
      - "mobile-bible-beta/tests/jacob-doctrine-browser.test.cjs"
      - "mobile-bible-beta/data/verse-doctrine-tags.v1.json"
      - "mobile-bible-beta/tests/jacob-scripture-links.test.cjs"
      - "review-jake-scripture.html"
      - "api/jacob-lannom/v1/current-commentary.json"
      - "api/jacob-lannom/v1/concepts/**"
      - "mobile-bible-beta/tests/portable-concept-registry.test.cjs"
      - "mobile-bible-beta/discovery-integrations.css"
      - "mobile-bible-beta/sw.js"
      - "mobile-bible-beta/icons/**"
      - "mobile-bible-beta/manifest.webmanifest"
      - "mobile-bible-sotw/**"
      - "mobile-bible-beta/tests/pwa-brands.test.cjs"
      - "mobile-bible-beta/tests/shared-asv-launch.test.cjs"
      - "mobile-bible-beta/tests/reader-deeplink-share.test.cjs"
      - "mobile-bible-beta/tests/shared-asv-launch-browser.test.cjs"
      - "mobile-bible-beta/tests/fixtures/romans-12-asv1901.json"
      - "mobile-bible-beta/tests/discovery-integration.test.cjs"
      - ".github/workflows/reader-discovery-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax gates
        run: |
          node --check mobile-bible-beta/discovery-integrations.js
          node --check mobile-bible-beta/universal-search.js
          node --check mobile-bible-beta/approved-names-search.js
          node --check mobile-bible-beta/tests/approved-names.test.cjs
          node --check mobile-bible-beta/tests/approved-names-browser.test.cjs
          node --check mobile-bible-beta/scripts/build-universal-search.mjs
          node --check mobile-bible-beta/tests/universal-search.test.cjs
          node --check mobile-bible-beta/tests/portable-concept-registry.test.cjs
          node --check mobile-bible-beta/tests/desktop-workspace-browser.test.cjs
          node --check mobile-bible-beta/study-ux-repair.js
          node --check mobile-bible-beta/jacob-scripture-links.js
          node --check mobile-bible-beta/reader-return.js
          node --check mobile-bible-beta/reader-trail.js
          node --check mobile-bible-beta/tests/reader-trail.test.cjs
          node --check mobile-bible-beta/jacob-search.js
          node --check mobile-bible-beta/tests/jacob-search.test.cjs
          node --check mobile-bible-beta/tests/jacob-doctrine.test.cjs
          node --check mobile-bible-beta/tests/jacob-scripture-links.test.cjs
          node --check mobile-bible-beta/tests/discovery-integration.test.cjs
          node --check mobile-bible-beta/tests/pwa-brands.test.cjs
          node --check mobile-bible-beta/tests/shared-asv-launch.test.cjs
      - name: Verify self-hosted Jacob concepts, schema, evidence and exact snapshot hashes
        run: node mobile-bible-beta/tests/portable-concept-registry.test.cjs
      - name: Verify all pinned source Q&A against generated search shards
        run: node mobile-bible-beta/scripts/build-universal-search.mjs --verify
      - name: Verify Universal Search source integrity, relevance and two-brand wiring
        run: node mobile-bible-beta/tests/universal-search.test.cjs
      - name: Verify approved name allowlist, excluded IDs, explicit links, evidence gates
        run: node mobile-bible-beta/tests/approved-names.test.cjs
      - name: Adapter behavior, stable IDs, Scripture and safety gates
        run: node mobile-bible-beta/tests/discovery-integration.test.cjs
      - name: Verify explicit Scripture URL precedence and author share scope
        run: node mobile-bible-beta/tests/reader-deeplink-share.test.cjs
      - name: Check service-worker cache ownership and official translation fallback
        run: node mobile-bible-beta/tests/shared-asv-launch.test.cjs
      - name: Verify separate CGBC and SOTW Study Bible PWA icons and manifests
        run: node mobile-bible-beta/tests/pwa-brands.test.cjs
      - name: Published Jacob Scripture-link safety, scope and navigation contract
        run: node mobile-bible-beta/tests/jacob-scripture-links.test.cjs
      - name: Published Jacob author/book/topic search and marker-first navigation
        run: node mobile-bible-beta/tests/jacob-search.test.cjs
      - name: Per-tab return to saved topic or search results
        run: node mobile-bible-beta/tests/reader-trail.test.cjs
      - name: Doctrine and aliases sourced only from accepted Jacob-evidence scopes
        run: node mobile-bible-beta/tests/jacob-doctrine.test.cjs
      - name: Published reader source contracts (Nave/Torrey and BSB)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const urls={
            topics:'https://raw.githubusercontent.com/Stewards-of-the-Way/bible-foundation/main/data/topics/nave-torrey/v1/index/topics.json',
            bsb:'https://raw.githubusercontent.com/SOTW-BSB/-bsb-resources/main/data/bsb/helloao-interlinear/v1/chapters/GEN/01.json',
            reverse:'https://raw.githubusercontent.com/Stewards-of-the-Way/bible-foundation/main/data/topics/nave-torrey/v1/index/by-scripture/GEN.json'
          };
          (async()=>{
            const read=async(url)=>{
              const response=await fetch(url,{signal:AbortSignal.timeout(25000)});
              assert(response.ok,'Remote source HTTP '+response.status);
              return response.json();
            };
            const [topics,bsb,reverse]=await Promise.all(Object.values(urls).map(read));
            assert.equal(topics.schema,'sotw-topics-search-index/1.0.0');
            assert.equal(topics.topics.length,5745);
            assert.equal(reverse.schema,'sotw-topics-scripture-index/1.0.0');
            assert(Array.isArray(reverse.verses['GEN.1.1'])&&reverse.verses['GEN.1.1'].includes('NEUU:TOPIC:creation'));
            assert.equal(bsb.schema,'sotw-bsb-helloao-interlinear-source/1.0.0');
            assert.equal(bsb.book_code,'GEN');assert.equal(bsb.chapter,1);
            assert(bsb.verses.some(v=>v.id==='GEN.1.1'&&v.words?.[0]?.strongs));
            const sourceWords=bsb.verses.find(v=>v.id==='GEN.1.1').words;
            assert.equal(sourceWords.length,7);
            const aligned=[...sourceWords].sort((a,b)=>a.bsbPos-b.bsbPos);
            assert.equal(aligned[0].gloss,'In the beginning');
            assert.equal(aligned[0].strongs,'H7225');
            assert.equal(aligned[1].gloss,'God');
            assert.equal(aligned[2].gloss,null);
            assert.equal(aligned[3].gloss,'created');
            console.log('PASS: live Nave/Torrey verse indexing and BSB publisher interlinear source contracts');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

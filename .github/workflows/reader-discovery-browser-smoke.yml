name: SOTW reader browser integration smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "mobile-bible-beta/tests/discovery-browser.test.cjs"
      - "mobile-bible-beta/study-ux-repair.js"
      - "mobile-bible-beta/discovery-integrations.js"
      - "mobile-bible-beta/index.html"
      - "mobile-bible-beta/icons/**"
      - "mobile-bible-beta/manifest.webmanifest"
      - "mobile-bible-beta/sw.js"
      - "mobile-bible-sotw/**"
      - "mobile-bible-beta/tests/pwa-brands-browser.test.cjs"
      - "mobile-bible-beta/tests/shared-asv-launch.test.cjs"
      - "mobile-bible-beta/tests/reader-deeplink-share-browser.test.cjs"
      - "mobile-bible-beta/tests/shared-asv-launch-browser.test.cjs"
      - "mobile-bible-beta/tests/fixtures/romans-12-asv1901.json"
      - "mobile-bible-beta/jacob-scripture-links.js"
      - "mobile-bible-beta/reader-return.js"
      - "mobile-bible-beta/reader-trail.js"
      - "mobile-bible-beta/tests/reader-trail.test.cjs"
      - "mobile-bible-beta/tests/reader-trail-browser.test.cjs"
      - "mobile-bible-beta/jacob-search.js"
      - "mobile-bible-beta/tests/jacob-search.test.cjs"
      - "mobile-bible-beta/tests/jacob-search-browser.test.cjs"
      - "mobile-bible-beta/tests/jacob-doctrine.test.cjs"
      - "mobile-bible-beta/tests/jacob-doctrine-browser.test.cjs"
      - "mobile-bible-beta/data/verse-doctrine-tags.v1.json"
      - "mobile-bible-beta/tests/jacob-scripture-browser.test.cjs"
      - "mobile-bible-beta/tests/exodus-link-browser.test.cjs"
      - "mobile-bible-beta/tests/bsb-lexical-browser.test.cjs"
      - "review-jake-scripture.html"
      - "api/jacob-lannom/v1/current-commentary.json"
      - ".github/workflows/reader-discovery-browser-smoke.yml"

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate real Chrome browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --version
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Install headless browser test driver only
        run: npm install --no-save --no-audit --no-fund playwright-core@1.58.2
      - name: Serve exact repository reader + published Scripture snapshots
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sotw-reader-http.log 2>&1 &
          echo $! >/tmp/sotw-reader-http.pid
          for n in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/mobile-bible-beta/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Verify both Study Bible deep links and verse/author sharing
        run: node mobile-bible-beta/tests/reader-deeplink-share-browser.test.cjs
      - name: Open a fresh ASV1901 shared link with raw GitHub blocked, using only official fallback
        run: node mobile-bible-beta/tests/shared-asv-launch-browser.test.cjs
      - name: Verify CGBC and SOTW installation branding at iPhone viewport
        run: node mobile-bible-beta/tests/pwa-brands-browser.test.cjs
      - name: Return from Scripture to last topic or search results without retyping
        run: node mobile-bible-beta/tests/reader-trail-browser.test.cjs
      - name: Show only validated doctrine and aliases on the matching Jacob commentary entry
        run: node mobile-bible-beta/tests/jacob-doctrine-browser.test.cjs
      - name: Exercise actual mobile viewport reader interactions
        run: node mobile-bible-beta/tests/discovery-browser.test.cjs
      - name: Exercise published Jacob cross-references in both viewers
        run: node mobile-bible-beta/tests/jacob-scripture-browser.test.cjs
      - name: Follow Jacob reference to Exodus 21:24 and return to Romans
        run: node mobile-bible-beta/tests/exodus-link-browser.test.cjs
      - name: Find published Jacob commentary and align marker-first Scripture navigation
        run: node mobile-bible-beta/tests/jacob-search-browser.test.cjs
      - name: Verify BSB Strong’s short meaning and English Webster action
        run: node mobile-bible-beta/tests/bsb-lexical-browser.test.cjs
